    <title>Special Character</title>

<body>
    <h1> NAMED ENTITY </h1>
    <p>Belajar Dasar Pemrograman Web &copy; 2023, Dicoding</p>

    <h1> NUMERIC ENTITY</h1>
    <p>Belajar Dasar Pemrograman Web &#169; 2023, Dicoding</p>

    <!--NOTE
    & = Ampersand = &amp; = &#038;
    ’ = Apostrophe = &apos; = &#039;
    < = Kurang dari (less-than) = &lt; = &#060;     
    > = Lebih dari (greater-than) = &gt; = &#062;
    © = Hak cipta (copyright) = &copy; = &#169;
    ® = Merek dagang terdaftar (registered trademark) = &reg; = &#174;
    ™ = Merek dagang (trademark) = &trade; = &#8482;
    £ = Pound = &pound; = &#163;
    ¥ = Yen = &yen; = &#165;
    € = Euro = &euro; = &#8364;
    – = En-dash = &ndash; = &#8211;
    — = Em-dash = &mdash; = &#8212;
    ‘ = Kutip tunggal kiri= &lsquo;= &#8216;
    ’ = Kutip tunggal kanan = &rsquo; = &#8217;
    “ = Kutip ganda kiri = &ldquo; = &#8220;
    ” = Kutip ganda kanan = &rdquo; = &#8221;
    • = Bullet = &bull; = &#8226;
    ... = Horizontal ellipsis = &hellip; = &#8230;

-->
</body>
</html>
