<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input User</title>
</head>
<body>
    <div>
        Text:
        <input type="text"/>
    </div>
    <div>
        Number:
        <input type="number"/>
    </div>
    <div>
        Email:
        <input type="email"/>
    </div>
    <div>
        Password:
        <input type="password"/>
    </div>


    <div>
        <label for="email">Email:</label>
        <br/>
        <input type="email" id="email" placeholder="user@gmail.com" required/>
    </div>
    <div>
        <label for="password">Password:</label>
        <br/>
        <input type="password" id="password" placeholder="******" required/>
    </div>
</body>
</html>


<!--Note
<input untuk bikin tabel user input
type untuk nentuin tipe apa user input
<placeholde untuk contoh input diisi
required agar user wajib input -->
