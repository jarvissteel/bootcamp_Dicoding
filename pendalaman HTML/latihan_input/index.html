<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input User</title>
</head>
<body>
    <div>
        Text:
        <input type="text"/>
    </div>
    <div>
        Number:
        <input type="number"/>
    </div>
    <div>
        Email:
        <input type="email"/>
    </div>
    <div>
        Password:
        <input type="password"/>
    </div>
</body>
</html>

<!--Note
<input untuk bikin tabel user input
type untuk nentuin tipe apa user input-->
