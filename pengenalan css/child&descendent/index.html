<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinators: Child Selector dan Descendant Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--CHILD SELECTOR-->
    <div class="child">
        <p> kalimat dalam div</p>
        <p> masih didalam</p>
        <section>
            <p>didalam tapi ga langsung</p>
        </section>
        <p> masih didalam juga masuknya</p>
    </div>
    <p> udah diluar div </p>
    <p> diluar juga</p>

    <!--DESCENDANT SELECTOR-->
    <div class="descendant">
        <p> kalimat dalam div</p>
        <p> masih didalam</p>
        <section>
            <p>didalam tapi ga langsung</p>
        </section>
        <p> masih didalam juga masuknya</p>
    </div>
    <p> udah diluar div </p>
    <p> diluar juga</p>
</body>
</html>
