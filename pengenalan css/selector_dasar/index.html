<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector Dasar: ID Selector, Attribute Selector, dan Universal Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Id selector-->
     <div id ="limited"> 
        <p>ini adalah kalimat dengan id "limited"</p>
     </div>
     <div>
        <p>ini ga pake</p>
     </div>

     <!--Attribute Selector-->
     <ul>
        <li><a href="#internal">Internal Link</a></li>
        <li><a href="http://contoh.com">exampleLink</a></li>
        <li><a href="#inSensitive">insensitive internal Link</a></li>
        <li><a href="http://contoh.org">org Link</a></li>
     </ul>

     <!--Universal Selector-->
     <p>gapake atribut apapun jadi ijo</p>
     <p lang="en-us">content paragraph english so ijo and italic</p>
     
     <h1> header bisa </h1>
     <h1 lang="en"> header english</h1>

     <p class="warning"> kalimat kelas warning</p>

     <div id="content">
        <p>teks dengan id content </p>
     </div>
</body>
</html>
