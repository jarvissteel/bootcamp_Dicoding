<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Text Styling: Line Height, Text Indent, dan Text Alignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <!-- LINE HEIGHT -->
        <p class="ln2"> jarak minimal teks pada garis dasar ke garis</p>
        <p class="ln200"> jarak minimal teks pada garis dasar ke garis</p>
        <p class="ln2em"> jarak minimal teks pada garis dasar ke garis</p>
    <main>

        <p class="tl-left">teks rata kiri</p>

        <p class="tl-justify">teks rata</p>
    </main>

</html>
